LoadModule mime_module modules/mod_mime.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule headers_module modules/mod_headers.so

ServerRoot "{INSTALL_DIR}/apache"
Listen {APACHE_PORT}
ServerName localhost
DocumentRoot "{INSTALL_DIR}/www"
PHPIniDir "{INSTALL_DIR}/php"

<Directory "{INSTALL_DIR}/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

LoadModule php_module "{INSTALL_DIR}/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php

DirectoryIndex index.php index.html

<VirtualHost *:{APACHE_PORT}>
    ServerName localhost
    DocumentRoot "{INSTALL_DIR}/www"

    # WebSocket pass-through
    ProxyPass "/ws" "ws://localhost:8081/"
    ProxyPassReverse "/ws" "ws://localhost:8081/"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /ws/(.*)  ws://localhost:8081/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /ws/(.*)  http://localhost:8081/$1 [P,L]
</VirtualHost>
