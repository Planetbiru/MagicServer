# ============================================================
# Modules
# ============================================================
LoadModule mime_module            modules/mod_mime.so
LoadModule authz_core_module      modules/mod_authz_core.so
LoadModule dir_module             modules/mod_dir.so
LoadModule rewrite_module         modules/mod_rewrite.so
LoadModule proxy_module           modules/mod_proxy.so
LoadModule proxy_http_module      modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module  modules/mod_proxy_wstunnel.so
LoadModule headers_module         modules/mod_headers.so
LoadModule alias_module           modules/mod_alias.so
LoadModule env_module             modules/mod_env.so
LoadModule php_module             "{INSTALL_DIR}/php/php8apache2_4.dll"

# ============================================================
# Server Root (shared binary)
# ============================================================
ServerRoot "{INSTALL_DIR}/apache"

# Runtime files UNIK per instance (wajib untuk multi-instance)
PidFile           "{INSTANCE_ROOT}/apache.pid"
ScoreBoardFile    "{INSTANCE_ROOT}/apache.scoreboard"
DefaultRuntimeDir "{INSTANCE_ROOT}"

# ============================================================
# Network
# ============================================================
Listen {APACHE_PORT}
ServerName localhost

# ============================================================
# DocumentRoot PER-INSTANCE (isolasi aplikasi)
# ============================================================
DocumentRoot "{INSTANCE_WWW}"

<Directory "{INSTANCE_WWW}">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# ============================================================
# phpMyAdmin SHARED via Alias
# Port MySQL otomatis mengikuti instance (MYSQL_PORT env var)
# ============================================================
Alias /phpMyAdmin "{PHPMYADMIN_DIR}"

<Directory "{PHPMYADMIN_DIR}">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Environment variables yang dibaca oleh PHP & phpMyAdmin
SetEnv MYSQL_PORT  {MYSQL_PORT}
SetEnv APP_NAME    {APP_NAME}
SetEnv APACHE_PORT {APACHE_PORT}

# ============================================================
# PHP
# ============================================================
PHPIniDir "{INSTANCE_ROOT}"
AddHandler application/x-httpd-php .php

DirectoryIndex index.php index.html

# ============================================================
# VirtualHost (WebSocket pass-through)
# ============================================================
<VirtualHost *:{APACHE_PORT}>
    ServerName localhost
    DocumentRoot "{INSTANCE_WWW}"

    <Directory "{INSTANCE_WWW}">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # WebSocket pass-through
    ProxyPass        "/ws" "ws://localhost:8081/"
    ProxyPassReverse "/ws" "ws://localhost:8081/"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /ws/(.*)  ws://localhost:8081/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /ws/(.*)  http://localhost:8081/$1 [P,L]
</VirtualHost>