[client]
port={MYSQL_PORT}
default-character-set=utf8mb4
no-auto-rehash

[mysqld]
port={MYSQL_PORT}
bind-address=0.0.0.0
basedir={MYSQL_HOME}
datadir={INSTANCE_MYSQL_DATA}
tmpdir={INSTANCE_TMP}
pid-file={INSTANCE_ROOT}/mysqld.pid
socket={INSTANCE_ROOT}/mysql.sock
log_error={INSTANCE_LOGS}/mariadb.log
slow_query_log=1
slow_query_log_file={INSTANCE_LOGS}/slow.log
long_query_time=2
skip-external-locking

# Character set
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# Buffer & cache
key_buffer_size=16M
max_allowed_packet=64M
table_open_cache=256
sort_buffer_size=1M
read_buffer_size=1M
read_rnd_buffer_size=4M
myisam_sort_buffer_size=8M
thread_cache_size=8
max_connections=100

# Storage engine
default_storage_engine=InnoDB
innodb_buffer_pool_size=128M
innodb_log_file_size=48M
innodb_file_per_table=1

# SQL mode
sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION

# Timezone
default_time_zone=SYSTEM

[mysqldump]
quick
quote-names
max_allowed_packet=64M

[myisamchk]
key_buffer_size=32M
sort_buffer_size=2M
read_buffer=2M
write_buffer=2M